name: Security & Vulnerability Audit

on:
  push:
    branches:
      - main
      - "chore/**"
      - "feat/**"
      - "ci/**"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 1" # Weekly Monday audit
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Supply-Chain & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Supply-Chain Dependency Audit
        run: pnpm audit --audit-level=high

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy Filesystem Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

      - name: Secret Leak & Private Key Scanner
        run: |
          echo "Scanning codebase for hardcoded private keys or production secrets..."
          ! grep -rE "BEGIN (RSA|EC|PGP|OPENSSH) PRIVATE KEY" --exclude-dir={.git,node_modules,dist,.turbo} .
          ! grep -rE "JWT_SECRET=production" --exclude-dir={.git,node_modules,dist,.turbo} .
          ! grep -rE "MASTER_TICKET_SECRET=production" --exclude-dir={.git,node_modules,dist,.turbo} .
          echo "No exposed secrets or hardcoded production private keys detected."

      - name: Run Automated Route Authorization & Security Suite
        run: pnpm --filter @urticketbuddy/api test -- test/security-audit.e2e-spec.ts
