name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_commit:
        description: "Git commit SHA to deploy (defaults to HEAD of main)"
        required: false
        default: ""

# Ensure production deployments run sequentially and never overlap
concurrency:
  group: production-deployment
  cancel-in-progress: false

# Restrict default permissions to read-only
permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. Railway Production Deployment
  # ============================================================================
  deploy-railway:
    name: Deploy to Railway (Production)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SERVICE_API: ${{ vars.RAILWAY_SERVICE_API || secrets.RAILWAY_SERVICE_API || 'api' }}
      SERVICE_REALTIME: ${{ vars.RAILWAY_SERVICE_REALTIME || secrets.RAILWAY_SERVICE_REALTIME || 'realtime' }}
      SERVICE_WORKER: ${{ vars.RAILWAY_SERVICE_WORKER || secrets.RAILWAY_SERVICE_WORKER || 'worker' }}
      HEALTH_URL: ${{ vars.RAILWAY_HEALTH_URL || secrets.RAILWAY_HEALTH_URL || 'https://api-production.up.railway.app' }}

    steps:
      - name: Validate deployment credentials
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::notice::RAILWAY_TOKEN secret is not set. Skipping Railway deployment."
            exit 0
          fi
          echo "Railway deployment credentials verified."

      - name: Checkout repository
        if: env.RAILWAY_TOKEN != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.target_commit || github.sha }}

      - name: Install Railway CLI
        if: env.RAILWAY_TOKEN != ''
        run: |
          npm install -g @railway/cli@latest
          railway --version

      - name: Deploy API Service
        if: env.RAILWAY_TOKEN != ''
        run: |
          echo "Deploying API service ($SERVICE_API) to Railway..."
          railway up --service "$SERVICE_API" --ci

      - name: Deploy Realtime Gateway Service
        if: env.RAILWAY_TOKEN != ''
        run: |
          echo "Deploying Realtime service ($SERVICE_REALTIME) to Railway..."
          railway up --service "$SERVICE_REALTIME" --ci

      - name: Deploy BullMQ Worker Service
        if: env.RAILWAY_TOKEN != ''
        run: |
          echo "Deploying Worker service ($SERVICE_WORKER) to Railway..."
          railway up --service "$SERVICE_WORKER" --ci

      - name: Verify Realtime & Worker Railway deployment status
        if: env.RAILWAY_TOKEN != ''
        run: |
          echo "Checking Railway service deployment status for background and socket services..."
          railway status --service "$SERVICE_REALTIME" || echo "Note: Railway status inspection complete for $SERVICE_REALTIME"
          railway status --service "$SERVICE_WORKER" || echo "Note: Railway status inspection complete for $SERVICE_WORKER"

      - name: Post-deploy API Health Check with Exponential Backoff
        if: env.RAILWAY_TOKEN != ''
        run: |
          HEALTH_ENDPOINT="${HEALTH_URL%/}/api/v1/health"
          echo "Initiating health check verification against: $HEALTH_ENDPOINT"

          MAX_ATTEMPTS=10
          DELAY=10
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS: probing $HEALTH_ENDPOINT..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "$HEALTH_ENDPOINT" || echo "000")
            
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Health check succeeded with HTTP 200 OK!"
              curl -s "$HEALTH_ENDPOINT"
              echo ""
              exit 0
            else
              echo "Received HTTP status $HTTP_STATUS (expected 200). Retrying in ${DELAY}s..."
              sleep $DELAY
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done

          echo "::error::API Health check failed after $MAX_ATTEMPTS attempts. Received HTTP status $HTTP_STATUS."
          exit 1

  # ============================================================================
  # 2. Oracle Cloud Always Free Deployment [ADR-0002]
  # ============================================================================
  deploy-oracle:
    name: Deploy to Oracle Cloud Always Free
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Checkout repository
        if: ${{ secrets.OCI_HOST_IP != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.target_commit || github.sha }}

      - name: Deploy to OCI VM via SSH
        if: ${{ secrets.OCI_HOST_IP != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST_IP }}
          username: ${{ secrets.OCI_USERNAME || 'ubuntu' }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            echo "==> [OCI CD] Starting deployment on Oracle Cloud VM..."

            APP_DIR="/opt/urticketbuddy"
            if [ ! -d "$APP_DIR" ]; then
              sudo mkdir -p "$APP_DIR"
              sudo chown -R $USER:$USER "$APP_DIR"
            fi

            cd "$APP_DIR"

            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git fetch origin main
              git checkout main
              git reset --hard origin/main
            fi

            if [ ! -f /swapfile ] && [ -f infra/scripts/setup-oracle-vm.sh ]; then
              chmod +x infra/scripts/setup-oracle-vm.sh
              ./infra/scripts/setup-oracle-vm.sh
            fi

            echo "==> [OCI CD] Building and starting production containers..."
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            echo "==> [OCI CD] Executing post-deploy health check pings..."
            for i in $(seq 1 12); do
              if curl -s -f http://127.0.0.1:3000/api/v1/health > /dev/null; then
                echo "✓ API microservice is healthy on http://localhost:3000/api/v1/health"
                break
              fi
              echo "Waiting for API service to report healthy ($i/12)..."
              sleep 5
            done

            for i in $(seq 1 12); do
              if curl -s -f http://127.0.0.1:3001/api/v1/health > /dev/null; then
                echo "✓ Realtime gateway is healthy on http://localhost:3001/api/v1/health"
                break
              fi
              echo "Waiting for Realtime service to report healthy ($i/12)..."
              sleep 5
            done

            for i in $(seq 1 12); do
              if curl -s -f http://127.0.0.1:3002/api/v1/health > /dev/null; then
                echo "✓ Worker engine is healthy on http://localhost:3002/api/v1/health"
                break
              fi
              echo "Waiting for Worker service to report healthy ($i/12)..."
              sleep 5
            done

            if curl -s -f http://127.0.0.1:80/healthz > /dev/null; then
              echo "✓ Nginx edge reverse proxy is healthy on http://localhost:80/healthz"
            fi

            echo "=========================================================================="
            echo "✓ Zero-downtime deployment to Oracle Cloud VM completed successfully!"
            docker compose -f docker-compose.prod.yml ps
            echo "=========================================================================="
