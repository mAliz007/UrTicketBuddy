apiVersion: v1
kind: ConfigMap
metadata:
  name: utb-config
  namespace: urticketbuddy
  labels:
    app.kubernetes.io/name: urticketbuddy
data:
  NODE_ENV: "production"
  API_PORT: "3000"
  REALTIME_PORT: "3001"
  WORKER_PORT: "3002"
  WEB_PORT: "80"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "6432"
  POSTGRES_DIRECT_PORT: "5432"
  POSTGRES_DB: "urticketbuddy"
  POSTGRES_USER: "postgres"
  MONGO_URI: "mongodb://mongo-service:27017/urticketbuddy"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  ELASTICSEARCH_NODE: "http://elasticsearch-service:9200"
  STORAGE_PROVIDER: "local"
  CDN_BASE_URL: "https://urticketbuddy.com/media"
