apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: urticketbuddy
  labels:
    app: utb-api
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: utb-api
---
apiVersion: v1
kind: Service
metadata:
  name: realtime-service
  namespace: urticketbuddy
  labels:
    app: utb-realtime
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
      name: websocket
  selector:
    app: utb-realtime
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: urticketbuddy
  labels:
    app: utb-web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: utb-web
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: urticketbuddy
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
    - port: 6432
      targetPort: 6432
      name: pgbouncer
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
  namespace: urticketbuddy
  labels:
    app: mongo
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb
  selector:
    app: mongo
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: urticketbuddy
  labels:
    app: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: redis
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-service
  namespace: urticketbuddy
  labels:
    app: elasticsearch
spec:
  type: ClusterIP
  ports:
    - port: 9200
      targetPort: 9200
      name: http
  selector:
    app: elasticsearch
