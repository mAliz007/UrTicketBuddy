# ==============================================================================
# UrTicketBuddy Kubernetes Secrets Template
# WARNING: NEVER commit live production secrets to git (AGENTS.md Rule 8).
# Replace these development placeholders before deploying to production clusters
# (e.g. via SealedSecrets, ExternalSecrets, or OCI Vault).
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: utb-secrets
  namespace: urticketbuddy
  labels:
    app.kubernetes.io/name: urticketbuddy
type: Opaque
stringData:
  JWT_SECRET: "k8s-dev-jwt-secret-min-16-characters-template"
  JWT_REFRESH_SECRET: "k8s-dev-jwt-refresh-secret-min-16-template"
  MASTER_TICKET_SECRET: "k8s-dev-master-ticket-secret-32-chars-long-template"
  POSTGRES_PASSWORD: "dev-postgres-password-template"
  REDIS_PASSWORD: ""
  STRIPE_SECRET_KEY: ""
  SAFEPAY_API_KEY: ""
