apiVersion: apps/v1
kind: Deployment
metadata:
  name: utb-realtime
  namespace: urticketbuddy
  labels:
    app: utb-realtime
    app.kubernetes.io/component: websocket-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: utb-realtime
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: utb-realtime
    spec:
      containers:
        - name: realtime
          image: urticketbuddy/realtime:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: websocket
          envFrom:
            - configMapRef:
                name: utb-config
            - secretRef:
                name: utb-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
